<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedMargin Renderer</title>
    <script>
        // Load correct theme stylesheet immediately based on system preference
        // JS render() will override if user has manual preference set
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.write('<link rel="stylesheet" id="theme-stylesheet" href="../styles/' + (isDark ? 'dark' : 'light') + '.css">');
        document.write('<link rel="stylesheet" id="highlight-stylesheet" href="../styles/highlight-' + (isDark ? 'dark' : 'light') + '.css">');
    </script>
    <link rel="stylesheet" href="../styles/gutter.css">
    <link rel="stylesheet" href="../styles/print.css">
</head>
<body>
    <div id="gutter-container">
        <div id="git-gutter" class="git-gutter"></div>
        <div id="line-numbers-container" class="line-numbers"></div>
    </div>
    <div id="content-container">Loading...</div>
    <script src="vendor/markdown-it.min.js"></script>
    <script src="vendor/markdown-it-task-lists.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="highlight.js"></script>
    <script src="sourcepos.js"></script>
    <script src="sourcepos-map.js"></script>
    <script src="lineNumbers.js"></script>
    <script src="gutter.js"></script>
    <script src="scrollPosition.js"></script>
    <script src="sanitizer.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="mermaid.js"></script>
    <script src="frontMatter.js"></script>
    <script src="headingAnchors.js"></script>
    <script src="tableCheckboxPlugin.js"></script>
    <script src="index.js"></script>
    <script src="checkboxHandler.js"></script>
</body>
</html>
